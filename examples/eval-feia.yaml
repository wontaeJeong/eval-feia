server:
  url: "http://127.0.0.1:4096"
  username: null
  password_env: null
  health_retries: 10
  health_interval_ms: 500

repo:
  path: "."
  base_ref: "HEAD"
  worktree_root: ".eval-feia/worktrees"

run:
  output_root: ".eval-feia/runs"
  candidates: 2
  concurrency: 1
  timeout_seconds: 3600
  prompt_file: "./examples/prompt.md"
  command: null
  agent: "build"
  model: null
  delete_sessions_after_collect: false

evals:
  - id: command-body-test
    prompt: "Run the command body evaluation described in the shared prompt context."
    branch_name: "eval/command-body-test"
    label: "command body test"
  - id: attach-healthcheck
    prompt: "Run the attach healthcheck evaluation described in the shared prompt context."
    branch_name: "eval/attach-healthcheck"
    label: "attach healthcheck"

validation:
  commands:
    - name: "tests"
      command: "pytest -q"
      timeout_seconds: 600
      required: false

summary:
  include_full_diff: false
  include_messages: true
  include_child_sessions: true
