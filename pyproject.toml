[project]
name = "eval-feia"
version = "0.1.0"
description = "OpenCode Agent Evaluation Harness for trajectory and output evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
eval-feia = "eval_feia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
