[project]
name = "eval-feia"
version = "0.1.0"
description = "OpenCode Agent Evaluation Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "rich>=13.7,<15.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
eval-feia = "eval_feia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
