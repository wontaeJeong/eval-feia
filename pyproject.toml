[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-feia"
version = "0.1.0"
description = "REST-only local evaluator for opencode worktree experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
eval-feia = "eval_feia.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
